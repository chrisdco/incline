name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run lint

      # Every component/hook in src/ must compile under React Compiler;
      # a bailout silently ships that function unoptimized.
      - run: pnpm run compiler:check

      - run: pnpm run test

      # Heavier integration suite (real query modules over better-sqlite3):
      # CI-only so local `pnpm test` stays instant on every small change.
      - run: pnpm run test:integration
