name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']

# A new push to a PR cancels its older run; main keeps every run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    # Real runs take ~80 s; anything near this is a hang, not slowness.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ESLint (content strategy: checkout mtimes are always new) and tsc
      # incremental state. A stale cache only costs speed, never correctness.
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache/ci
          key: ci-cache-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: ci-cache-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', 'tsconfig.json') }}-

      - run: pnpm run typecheck --incremental --tsBuildInfoFile node_modules/.cache/ci/tsbuildinfo

      - run: pnpm run lint -- --cache --cache-strategy content --cache-location node_modules/.cache/ci/eslint/

      # src/contracts is copied to supabase/functions/_shared for Deno; a stale
      # copy means the edge runs different gates than the app (#189).
      - run: node scripts/sync-contracts.mjs --check

      # Every component/hook in src/ must compile under React Compiler;
      # a bailout silently ships that function unoptimized.
      - run: pnpm run compiler:check

      - run: pnpm run test

      # Heavier integration suite (real query modules over better-sqlite3):
      # CI-only so local `pnpm test` stays instant on every small change.
      - run: pnpm run test:integration
